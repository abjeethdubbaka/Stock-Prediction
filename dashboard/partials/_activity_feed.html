<div class="card mb-4">
    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Recent Activity</h5>
            <button class="btn btn-sm btn-outline-secondary" id="refreshActivity">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="list-group list-group-flush" id="activityFeed">
            {% for activity in current_user.activities|sort(attribute='timestamp', reverse=True)|batch(10)|first %}
            <div class="list-group-item list-group-item-action">
                <div class="d-flex align-items-center">
                    <div class="activity-icon me-3 bg-{{ activity.type|activity_color }} text-white">
                        <i class="bi {{ activity.type|activity_icon }}"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <h6 class="mb-1">{{ activity.title }}</h6>
                            <small class="text-muted" data-timestamp="{{ activity.timestamp.isoformat() }}">
                                {{ activity.timestamp|humanize }}
                            </small>
                        </div>
                        <p class="mb-1 small text-muted">{{ activity.description }}</p>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="list-group-item">
                <p class="text-center text-muted my-3">No recent activity</p>
            </div>
            {% endfor %}
        </div>
        <div class="text-center py-2 border-top">
            <a href="{{ url_for('main.activity_log') }}" class="btn btn-sm btn-link">View All Activity</a>
        </div>
    </div>
</div>
